<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conversa AI — offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f0d17; color: #e9e6f0; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    button { margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 10px; background: linear-gradient(135deg, #f8306a, #c026d3); color: #fff; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Conversa needs a connection to reach your account and the AI.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
